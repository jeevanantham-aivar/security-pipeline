name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Install Checkov
      - name: Install Checkov
        run: pip install --upgrade checkov

      # Step 3: Install Reviewdog (optional, if you want PR comments, see note)
      - name: Install Reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /usr/local/bin

      # Step 4: Set environment for Terraform plan
      - name: Set TFVARS path
        id: set_tfvars
        run: |
          # Set to the tfvars path you expect (change as needed)
          echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV

      # Step 5: Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 6: Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: Terraform

      # Step 7: Generate Terraform plan file (handle missing tfvars file)
      - name: Terraform Plan
        run: |
          if [ -f "${TFVARS}" ]; then
            terraform plan -var-file=${TFVARS} -out=tfplan.binary
          else
            terraform plan -out=tfplan.binary
          fi
        working-directory: Terraform

      # Step 8: Convert plan to JSON for Checkov scanning
      - name: Convert Plan to JSON
        run: terraform show -json tfplan.binary > tfplan.json
        working-directory: Terraform

      # Step 9: Run Checkov scan on Terraform plan file, SARIF format v2.1.0+
      - name: Run Checkov Scan on Plan
        run: checkov -f Terraform/tfplan.json --output sarif --output-file Terraform/checkov.sarif --sarif-version 2.1.0

      # Step 10: Upload SARIF results to GitHub Advanced Security (Security tab)
      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Terraform/checkov.sarif
