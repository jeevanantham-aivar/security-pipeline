name: "Security Scans (CodeQL + Bandit + Checkov)"

on:
  pull_request:
    branches: [ "feature/testing1" ]
  push:
    branches: [ "feature/testing1" ]
  schedule:
    - cron: '29 5 * * 0'

permissions:
  contents: read
  pull-requests: write   # ✅ Needed to comment on PR
  security-events: write # ✅ Needed for CodeQL SARIF upload

jobs:
  analyze:
    name: CodeQL + Bandit + Checkov
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
    # ----------------- 1. Checkout Code -----------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ----------------- 2. Initialize CodeQL -----------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # ----------------- 3. CodeQL Analysis -----------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

    # ----------------- 4. Setup Python -----------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install Bandit + Checkov
      run: |
        pip install bandit checkov

    # ----------------- 5. Install reviewdog -----------------
    - name: Install reviewdog
      uses: reviewdog/action-setup@v1
      with:
        reviewdog_version: latest

    # ----------------- 6. Run Bandit -----------------
    - name: Run Bandit (Python Security)
      run: |
        bandit -r . -f sarif -o bandit.sarif || true
        reviewdog -f=sarif -name="Bandit" -reporter=github-pr-review < bandit.sarif
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ----------------- 7. Run Checkov -----------------
    - name: Run Checkov (Terraform Security)
      run: |
        checkov -d . -o sarif > checkov.sarif || true
        reviewdog -f=sarif -name="Checkov" -reporter=github-pr-review < checkov.sarif
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
