name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write  # Needed for posting PR comments
  id-token: write

jobs:
  security-scan:
    if: |
      (startsWith(github.head_ref, 'feature/') && github.base_ref == 'develop') ||
      (github.head_ref == 'develop' && github.base_ref == 'stage') ||
      (github.head_ref == 'stage' && github.base_ref == 'main') ||
      (startsWith(github.head_ref, 'feature/') && github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::302263040839:role/Githubactions
          aws-region: ap-south-1

      # 3️⃣ Install Checkov & Reviewdog
      - name: Install Checkov & Reviewdog
        run: |
          pip install checkov
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /usr/local/bin

      # 4️⃣ Determine environment for Terraform variables
      - name: Set environment for Terraform plan
        id: set_env
        run: |
          if [[ "${{ github.head_ref }}" == feature/* && "${{ github.base_ref }}" == "develop" ]]; then
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == feature/* && "${{ github.base_ref }}" == "main" ]]; then
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == "develop" && "${{ github.base_ref }}" == "stage" ]]; then
            echo "TFVARS=staging/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == "stage" && "${{ github.base_ref }}" == "main" ]]; then
            echo "TFVARS=production/terraform.tfvars" >> $GITHUB_ENV
          else
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          fi

      # 5️⃣ Setup Terraform CLI
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # 6️⃣ Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: Terraform

      # 7️⃣ Terraform Plan (optional if you want plan output)
      - name: Terraform Plan
        run: terraform plan -var-file=./environments/${TFVARS} -out=tfplan.binary
        working-directory: Terraform

      # 8️⃣ Run Checkov directly on Terraform HCL files
      - name: Run Checkov + Reviewdog (PR Comments)
        run: |
          # Scan all Terraform HCL files in the modules directory
          checkov -d Terraform/modules -o sarif --output-file-path checkov.sarif || true
          
          # Post SARIF results to PR comments
          reviewdog -f=sarif \
                     -name="Checkov" \
                     -reporter=github-pr-review \
                     -fail-on-error=false < checkov.sarif
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
