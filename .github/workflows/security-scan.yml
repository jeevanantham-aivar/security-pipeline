name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  security-scan:
    if: |
      (startsWith(github.head_ref, 'feature/') && github.base_ref == 'develop') ||
      (github.head_ref == 'develop' && github.base_ref == 'stage') ||
      (github.head_ref == 'stage' && github.base_ref == 'main') ||
      (startsWith(github.head_ref, 'feature/') && github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::302263040839:role/Githubactions
          aws-region: ap-south-1

      - name: Install Checkov & Reviewdog
        run: |
          pip install checkov
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /usr/local/bin

      - name: Set environment for plan
        id: set_env
        run: |
          if [[ "${{ github.head_ref }}" == feature/* && "${{ github.base_ref }}" == "develop" ]]; then
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == "feature/*" && "${{ github.base_ref }}" == "main" ]]; then
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == "develop" && "${{ github.base_ref }}" == "stage" ]]; then
            echo "TFVARS=staging/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == "stage" && "${{ github.base_ref }}" == "main" ]]; then
            echo "TFVARS=production/terraform.tfvars" >> $GITHUB_ENV
          else
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: Terraform

      - name: Terraform Plan
        run: terraform plan -var-file=./environments/${TFVARS} -out=tfplan.binary
        working-directory: Terraform

      - name: Convert Plan to JSON
        run: terraform show -json tfplan.binary > tfplan.json
        working-directory: Terraform

      # ✅ Run Checkov + send results to PR comments using SARIF
      - name: Run Checkov with Reviewdog (PR Comments)
        run: |
          checkov -f tfplan.json --repo-root-for-plan-enrichment . -o sarif > checkov.sarif || true
          reviewdog -f=sarif -name="Checkov" -reporter=github-pr-review -fail-on-error=false < checkov.sarif
        working-directory: Terraform
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

