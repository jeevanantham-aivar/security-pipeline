name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write # REQUIRED for SARIF upload
  id-token: write

jobs:
  security-scan:
    if: |
      (startsWith(github.head_ref, 'feature/') && github.base_ref == 'develop') ||
      (github.head_ref == 'develop' && github.base_ref == 'stage') ||
      (github.head_ref == 'stage' && github.base_ref == 'main') ||
      (startsWith(github.head_ref, 'feature/') && github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::302263040839:role/Githubactions
          aws-region: ap-south-1

      # Install tools
      - name: Install Bandit, Checkov, SARIF tools, Reviewdog
        run: |
          pip install bandit checkov sarif-tools
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh \
            | sh -s -- -b /usr/local/bin

      # Set TFVARS based on branch flow
      - name: Set environment for plan
        run: |
          if [[ "${{ github.head_ref }}" =~ feature/.* && "${{ github.base_ref }}" == "develop" ]]; then
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" =~ feature/.* && "${{ github.base_ref }}" == "main" ]]; then
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == "develop" && "${{ github.base_ref }}" == "stage" ]]; then
            echo "TFVARS=staging/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == "stage" && "${{ github.base_ref }}" == "main" ]]; then
            echo "TFVARS=production/terraform.tfvars" >> $GITHUB_ENV
          else
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV # Default fallback
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: Terraform

      - name: Terraform Plan
        run: terraform plan -var-file=./environments/${TFVARS} -out=tfplan.binary
        working-directory: Terraform

      - name: Convert Plan to JSON
        run: terraform show -json tfplan.binary > tfplan.json
        working-directory: Terraform

      # ---------------- Bandit ----------------
      # - name: Run Bandit
      #   run: |
      #     bandit -r . -f json -o bandit.json || true
      #     sarif from-bandit bandit.json bandit.sarif

      # - name: Upload Bandit SARIF
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: bandit.sarif

      # - name: Report Bandit Issues (Reviewdog)
      #   run: |
      #     bandit -r . -f txt || true | reviewdog -f=golint -name="bandit" -reporter=github-pr-review

      # ---------------- Checkov ----------------
      - name: Run Checkov
        run: |
          checkov -f tfplan.json --repo-root-for-plan-enrichment . \
            -o sarif --output-file-path checkov.sarif || true
        working-directory: Terraform

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Terraform/checkov.sarif

      - name: Report Checkov Issues (Reviewdog)
        run: |
          checkov -f tfplan.json --repo-root-for-plan-enrichment . -o cli || true \
            | reviewdog -efm="%f:%l:%m" -name="checkov" -reporter=github-pr-review

      # ---------------- Artifacts ----------------
      - name: Upload Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit.json
            bandit.sarif
            Terraform/checkov.sarif
          retention-days: 30
