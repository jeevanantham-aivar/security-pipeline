name: "Security Scans (CodeQL + Bandit + Checkov)"

on:
  pull_request:
    branches: [ "feature/testing1" ]
  push:
    branches: [ "feature/testing1" ]
  schedule:
    - cron: '29 5 * * 0'

permissions:
  contents: read
  pull-requests: write   # ✅ Needed to comment on PR
  security-events: write # ✅ Needed for CodeQL SARIF upload

jobs:
  analyze:
    name: CodeQL + Bandit + Checkov
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
    # ----------------- 1. Checkout Code -----------------
    - name: Checkout repository
      uses: actions/checkout@v4
      # ✅ Required: pulls your Terraform + Python code

    # ----------------- 2. Initialize CodeQL -----------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
      # ✅ Sets up CodeQL to scan your Python + Actions code

    # ----------------- 3. CodeQL Analysis -----------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
      # ✅ Runs CodeQL, sends SARIF results to GitHub Security tab
      # (baseline protection against CVEs + security flaws)

    # ----------------- 4. Setup Python -----------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
      # ✅ Required for running Bandit & Checkov

    - name: Install Bandit + Checkov
      run: |
        pip install bandit checkov reviewdog
      # ✅ Install security scanners + reviewdog

    # ----------------- 5. Run Bandit -----------------
    - name: Run Bandit (Python Security)
      run: |
        bandit -r . -f json | reviewdog -f=bandit -name="Bandit" -reporter=github-pr-review -level=error
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ✅ Bandit scans Python code for security issues
      # ✅ reviewdog converts results → PR inline comments

    # ----------------- 6. Run Checkov -----------------
    - name: Run Checkov (Terraform Security)
      run: |
        checkov -d . -o json | reviewdog -f=checkov -name="Checkov" -reporter=github-pr-review -level=error
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ✅ Checkov scans Terraform/IaC for misconfigs
      # ✅ reviewdog adds inline PR comments with findings
