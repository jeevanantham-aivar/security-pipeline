name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write # REQUIRED for SARIF upload
  id-token: write

jobs:
  security-scan:
    if: |
      (startsWith(github.head_ref, 'feature/') && github.base_ref == 'develop') ||
      (github.head_ref == 'develop' && github.base_ref == 'stage') ||
      (github.head_ref == 'stage' && github.base_ref == 'main') ||
      (startsWith(github.head_ref, 'feature/') && github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::302263040839:role/Githubactions
          aws-region: ap-south-1

      # Install tools
      - name: Install Bandit, Checkov, SARIF tools
        run: |
          pip install bandit checkov sarif-tools

      # Set TFVARS based on branch flow
      - name: Set environment for plan
        run: |
          if [[ "${{ github.head_ref }}" =~ feature/.* && "${{ github.base_ref }}" == "develop" ]]; then
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" =~ feature/.* && "${{ github.base_ref }}" == "main" ]]; then
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == "develop" && "${{ github.base_ref }}" == "stage" ]]; then
            echo "TFVARS=staging/terraform.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.head_ref }}" == "stage" && "${{ github.base_ref }}" == "main" ]]; then
            echo "TFVARS=production/terraform.tfvars" >> $GITHUB_ENV
          else
            echo "TFVARS=development/terraform.tfvars" >> $GITHUB_ENV # Default fallback
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: Terraform

      - name: Terraform Plan
        run: terraform plan -var-file=./environments/${TFVARS} -out=tfplan.binary
        working-directory: Terraform

      - name: Convert Plan to JSON
        run: terraform show -json tfplan.binary > tfplan.json
        working-directory: Terraform

      # # Run Bandit → JSON → SARIF
      # - name: Run Bandit (JSON → SARIF)
      #   run: |
      #     bandit -r . -f json -o bandit.json || true
      #     sarif from-bandit bandit.json bandit.sarif

      # Run Checkov → SARIF
      - name: Run Checkov (SARIF)
        run: |
          checkov -f tfplan.json --repo-root-for-plan-enrichment . -o sarif --output-file-path checkov.sarif || true
        working-directory: Terraform

      # Upload Bandit SARIF
      - name: Upload Bandit SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif

      # Upload Checkov SARIF
      - name: Upload Checkov SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Terraform/checkov.sarif

      # Upload raw reports as artifacts (for debugging)
      - name: Upload Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit.json
            bandit.sarif
            Terraform/checkov.sarif
          retention-days: 30
